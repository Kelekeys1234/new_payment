server:
  port: 8080

spring:
  application:
    name: nehemiah-building-payment
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  data:
    mongodb:
      uri:  mongodb+srv://kelennafavour:Mamawowosani1234%40@nehemiahbuilders.aefet2x.mongodb.net/nehemiah_builders?appName=nehemiahBuilders
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  mail:
    host: ${APP_MAIL_HOST:smtp.gmail.com}
    port: ${APP_MAIL_PORT:587}
    username: ${APP_MAIL_USERNAME:}
    password: ${APP_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  receipts:
    upload-dir: ${RECEIPT_UPLOAD_DIR:./uploads/receipts}
  security:
    # IMPORTANT: override APP_JWT_SECRET in any real deployment (HS256 needs >= 32 bytes).
    jwt-secret: ${APP_JWT_SECRET:dev-only-change-me-32-bytes-minimum-secret-key}
    jwt-expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:43200}
    super-admin-phone: ${APP_SUPER_ADMIN_PHONE:+2349078902655}
  sms:
    provider: termii
    termii:
      base-url: https://api.ng.termii.com
      api-key: tlv_3Jq8_TjzCNmzwZCZfohhfER3xKXfcSJT14VZi-__ZGA
      sender-id: Termii
  public-base-url: ${APP_PUBLIC_BASE_URL:https://newpayment-production.up.railway.app}
  mail:
    # Set to "smtp" once real SMTP credentials are provided via env vars; defaults to "log"
    # (prints the confirm/reject email to the server log instead of sending it) so the app
    # keeps working out of the box before mail is configured.
    provider: ${APP_MAIL_PROVIDER:log}
    from: ${APP_MAIL_FROM:no-reply@nehemiahbuilders.org}
  giving:
    admin-email: ${APP_GIVING_ADMIN_EMAIL:fklenna@gmail.com}

logging:
  level:
    root: INFO
    com.example.payment: DEBUG
